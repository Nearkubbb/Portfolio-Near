<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Portfolio | ครูผู้สอนเทคโนโลยีและการเขียนโปรแกรม</title>
    
    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ================= VARIABLES & RESET ================= */
        :root {
            --primary: #ec4899;         /* ชมพูหลัก (Pink 500) */
            --primary-dark: #db2777;    /* ชมพูเข้มตอน Hover (Pink 600) */
            --primary-light: #fdf2f8;   /* ชมพูอ่อนมากสำหรับพื้นหลัง (Pink 50) */
            --primary-soft: #fce7f3;    /* ชมพูพาสเทล (Pink 100) */
            --accent: #f43f5e;          /* สีเน้น (Rose 500) */
            --bg-white: #ffffff;
            --text-dark: #1f2937;       /* เทาเข้มอ่านง่าย */
            --text-muted: #6b7280;      /* เทากลาง */
            --border-color: #fbcfe8;    /* ขอบชมพูอ่อน */
            --shadow-sm: 0 4px 6px -1px rgba(236, 72, 153, 0.08);
            --shadow-md: 0 10px 25px -5px rgba(236, 72, 153, 0.15);
            --radius: 16px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-white);
            color: var(--text-dark);
            line-height: 1.7;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ================= NAVBAR ================= */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--primary-soft);
            z-index: 1000;
            transition: var(--transition);
        }

        header.scrolled {
            box-shadow: var(--shadow-sm);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 75px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            background: var(--primary-soft);
            padding: 8px;
            border-radius: 10px;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .nav-link {
            font-weight: 500;
            color: var(--text-dark);
            position: relative;
            padding: 5px 0;
            transition: var(--transition);
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--primary);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2.5px;
            background: var(--primary);
            border-radius: 2px;
            transition: var(--transition);
        }

        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }

        .btn-github-nav {
            background: var(--primary);
            color: #fff;
            padding: 9px 18px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .btn-github-nav:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .hamburger {
            display: none;
            font-size: 1.5rem;
            color: var(--primary);
            cursor: pointer;
            background: none;
            border: none;
        }

        /* ================= BUTTONS ================= */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 26px;
            border-radius: 50px;
            font-family: 'Prompt', sans-serif;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .btn-outline {
            background: #fff;
            color: var(--primary);
            border-color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary-light);
            transform: translateY(-3px);
        }

        /* ================= SECTION 1: HERO (หน้าแรก) ================= */
        .hero {
            min-height: 100vh;
            padding: 120px 0 80px;
            background: linear-gradient(135deg, var(--primary-light) 0%, #ffffff 60%, var(--primary-soft) 100%);
            display: flex;
            align-items: center;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 48px;
            align-items: center;
        }

        .badge {
            display: inline-block;
            background: var(--primary-soft);
            color: var(--primary-dark);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .hero-title {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 16px;
            color: var(--text-dark);
        }

        .hero-title span {
            color: var(--primary);
        }

        .hero-desc {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 32px;
            max-width: 560px;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .hero-visual {
            display: flex;
            justify-content: center;
        }

        .profile-card-visual {
            background: #fff;
            padding: 32px;
            border-radius: 24px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            text-align: center;
            width: 100%;
            max-width: 340px;
            position: relative;
        }

        .avatar-circle {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #f472b6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 3.5rem;
            box-shadow: 0 10px 20px rgba(236, 72, 153, 0.25);
        }

        .code-snippet-box {
            background: var(--primary-light);
            border-radius: 12px;
            padding: 12px;
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--primary-dark);
            font-family: monospace;
        }

        /* ================= SECTION COMMON ================= */
        section {
            padding: 90px 0;
        }

        .section-header {
            text-align: center;
            margin-bottom: 56px;
        }

        .section-subtitle {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-top: 6px;
        }

        .section-line {
            width: 60px;
            height: 4px;
            background: var(--primary);
            margin: 14px auto 0;
            border-radius: 2px;
        }

        /* ================= SECTION 2: ABOUT (แนะนำตัว) ================= */
        .about {
            background: var(--bg-white);
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: start;
        }

        .about-card {
            background: var(--primary-light);
            padding: 36px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
        }

        .about-card h3 {
            font-size: 1.4rem;
            color: var(--primary-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-list li {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .info-list i {
            color: var(--primary);
            width: 20px;
            text-align: center;
        }

        .skills-wrapper h3 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: var(--text-dark);
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
        }

        .
